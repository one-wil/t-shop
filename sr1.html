
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>حاسبة ترميز المناوبات R1-R8</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;padding:16px;background:#f0f3f8;
 color:#263449;font-family:Arial,sans-serif
}
.container{
 max-width:650px;margin:auto;background:white;
 padding:22px;border-radius:18px;
 box-shadow:0 5px 25px #0001
}
h2{text-align:center;color:#174b7a}
.sub{text-align:center;color:#8995a5;font-size:13px}
label{display:block;font-weight:bold;margin:17px 0 8px}
input,select{
 width:100%;padding:13px;border:1px solid #d2dbe6;
 border-radius:10px;background:white;font-size:16px;
 color:#263449
}
button{
 width:100%;padding:14px;margin-top:18px;
 border:0;border-radius:10px;background:#1765a5;
 color:white;font-size:16px;font-weight:bold;cursor:pointer
}
button:hover{background:#104b7d}
.result{
 display:none;margin-top:22px;padding:16px;
 background:#edf5ff;border-radius:13px
}
.result h3{color:#14558c}
.info{
 background:white;padding:13px;border-radius:10px;
 line-height:2.1;overflow-wrap:anywhere
}
table{width:100%;border-collapse:collapse;margin-top:15px}
th,td{
 padding:11px 5px;text-align:center;
 border-bottom:1px solid #dce4ed;font-size:13px
}
th{background:#dfeaf6}
.code{
 display:inline-block;background:#dceeff;color:#14558c;
 padding:5px 9px;border-radius:7px;font-weight:bold;
 white-space:nowrap
}
.note{font-size:12px;color:#718096;line-height:1.8;margin-top:16px}
.actions{display:flex;gap:8px}
.actions button{flex:1}
@media print{
 body{background:white;padding:0}
 .container{box-shadow:none}
 .form,.actions,.note{display:none!important}
 .result{display:block!important}
}
</style>
</head>

<body>
<div class="container">

<h2>حاسبة ترميز المناوبات</h2>
<p class="sub">Système de roulement – R1 à R8</p>

<div class="form">

<label>الترميز الأصلي للعامل</label>
<select id="original">
<option value="1">R1</option>
<option value="2">R2</option>
<option value="3">R3</option>
<option value="4">R4</option>
<option value="5">R5</option>
<option value="6">R6</option>
<option value="7">R7</option>
<option value="8">R8</option>
</select>

<label>يوم المناوبة</label>
<select id="day">
<option>Samedi</option>
<option>Dimanche</option>
<option>Lundi</option>
<option>Mardi</option>
<option>Mercredi</option>
<option>Jeudi</option>
<option>Vendredi</option>
</select>

<label>تاريخ بداية العمل</label>
<input type="date" id="start">

<label>عدد أسابيع العمل المطلوبة</label>
<select id="work"></select>

<label>عدد أسابيع الراحة المطلوبة</label>
<select id="rest"></select>

<button onclick="calculate()">احسب الترميز والتواريخ</button>
</div>

<div class="result" id="result">

<h3>نتائج الحساب</h3>
<div class="info" id="summary"></div>

<h3>جدول تغيير الترميز</h3>
<table>
<thead>
<tr>
<th>المرحلة</th>
<th>التاريخ</th>
<th>الترميز</th>
</tr>
</thead>
<tbody id="details"></tbody>
</table>

<div class="actions">
<button onclick="window.print()">طباعة النتائج</button>
<button onclick="calculate()">تحديث الحساب</button>
</div>
</div>

<p class="note">
الحساب يعتمد على أسابيع متتالية، كل أسبوع 7 أيام.
يوم المناوبة يبقى ثابتاً أثناء تغيير رقم الترميز.
</p>

</div>

<script>

// إنشاء خيارات الأسابيع من 1 إلى 8
function fillOptions(id){
 const select=document.getElementById(id);

 for(let i=1;i<=8;i++){
  const option=document.createElement("option");
  option.value=i;
  option.textContent=i===1?"أسبوع واحد":i+" أسابيع";
  if(i===4)option.selected=true;
  select.appendChild(option);
 }
}

fillOptions("work");
fillOptions("rest");

// الانتقال الدائري بين R1 و R8
function nextCode(code,shift){
 return ((code-1+shift)%8+8)%8+1;
}

// إضافة أيام إلى التاريخ
function addDays(date,days){
 const d=new Date(date+"T12:00:00");
 d.setDate(d.getDate()+days);

 return d.getFullYear()+"-"+
 String(d.getMonth()+1).padStart(2,"0")+"-"+
 String(d.getDate()).padStart(2,"0");
}

// تنسيق التاريخ
function format(date){
 const p=date.split("-");
 return p[2]+"/"+p[1]+"/"+p[0];
}

// اسم الترميز
function codeName(code,day){
 return day+" R"+code;
}

// الحساب الرئيسي
function calculate(){

 const original=Number(
  document.getElementById("original").value
 );

 const day=document.getElementById("day").value;
 const start=document.getElementById("start").value;
 const work=Number(document.getElementById("work").value);
 const rest=Number(document.getElementById("rest").value);

 if(!start){
  alert("يرجى إدخال تاريخ بداية العمل");
  return;
 }

 // تحديد ترميز العمل
 const workCode=nextCode(original,work-4);

 let rows=[];

 // بداية العمل
 const initialWorkCode=work<4?workCode:original;

 rows.push([
  "بداية العمل",
  start,
  initialWorkCode
 ]);

 // تغيير الترميز أثناء العمل
 if(work>4){

  const changeWork=addDays(
   start,(work-4)*7
  );

  rows.push([
   "تغيير ترميز العمل",
   changeWork,
   workCode
  ]);
 }

 // بداية الراحة
 const restStart=addDays(start,work*7);

 rows.push([
  "بداية الراحة",
  restStart,
  workCode
 ]);

 // ترميز الراحة
 let restCode=workCode;

 // تغيير الترميز بعد 4 أسابيع راحة
 if(rest>4){

  const changeRest=addDays(restStart,27);

  restCode=nextCode(workCode,1);

  rows.push([
   "تغيير ترميز الراحة",
   changeRest,
   restCode
  ]);
 }

 // نهاية الراحة
 const restEnd=addDays(
  start,(work+rest)*7-1
 );

 rows.push([
  "نهاية الراحة",
  restEnd,
  restCode
 ]);

 // تاريخ العودة إلى العمل
 const returnDate=addDays(
  start,(work+rest)*7
 );

 // تحديد ترميز العودة
 let returnCode;

 if(work===4 && rest===4){

  // دورة عادية: العودة إلى الترميز الأصلي
  returnCode=original;

 }else if(rest>4){

  // راحة أكثر من أربعة أسابيع
  returnCode=restCode;

 }else if(rest===4){

  // أربعة أسابيع راحة
  returnCode=workCode;

 }else{

  // أقل من أربعة أسابيع راحة:
  // العودة إلى الرمز السابق لترميز العمل
  returnCode=nextCode(workCode,-1);
 }

 rows.push([
  "العودة إلى العمل",
  returnDate,
  returnCode
 ]);

 // عرض الملخص
 document.getElementById("summary").innerHTML=`
 <div>الترميز الأصلي:
 <b>${codeName(original,day)}</b></div>

 <div>ترميز العمل:
 <span class="code">${codeName(workCode,day)}</span></div>

 <div>ترميز الراحة:
 <span class="code">${codeName(restCode,day)}</span></div>

 <div>ترميز العودة:
 <span class="code">${codeName(returnCode,day)}</span></div>

 <div>مدة العمل: <b>${work} أسابيع</b></div>
 <div>مدة الراحة: <b>${rest} أسابيع</b></div>
 <div>يوم المناوبة: <b>${day}</b></div>
 `;

 // عرض جدول المراحل
 document.getElementById("details").innerHTML=
 rows.map(r=>`
 <tr>
 <td>${r[0]}</td>
 <td>${format(r[1])}</td>
 <td><span class="code">${codeName(r[2],day)}</span></td>
 </tr>
 `).join("");

 document.getElementById("result").style.display="block";

 document.getElementById("result").scrollIntoView({
  behavior:"smooth",
  block:"start"
 });
}

</script>
</body>
</html>
